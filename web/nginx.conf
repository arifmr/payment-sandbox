server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite already minifies; gzip is what makes it small on the wire.
    # The 89 KB bundle compresses to roughly a quarter of that.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # nginx defaults to level 1 (fastest, weakest). These are static files compressed
    # once per request at worst, so trading a little CPU for a materially smaller
    # transfer is the right call: level 1 gives ~102 KB on the main bundle, level 6 ~90 KB.
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Backend, reached over the compose network by service name. Serving the API from
    # the same origin as the app is deliberate and load-bearing: it is what lets the
    # backend ship with no CORS middleware at all. See agent_documentation/07-frontend.md
    # section 8 — in dev the Vite proxy plays this exact role.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Overwrite rather than append ($proxy_add_x_forwarded_for). The backend rate
        # limits per client IP via gin's c.ClientIP(), which reads this header. Appending
        # would preserve a value the caller sent, letting them forge a fresh rate-limit
        # bucket per request and walk straight past the per-IP budget. There is exactly
        # one proxy hop here, so $remote_addr is the whole truth.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Payment settlement is a normal request; the defaults are fine. Kept explicit
        # so a slow admin action fails with a clear 504 instead of nginx's silent default.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Vite emits content-hashed filenames under /assets/, so the bytes behind a given
    # URL never change. Caching them for a year costs nothing and a new deploy simply
    # produces new URLs.
    location /assets/ {
        # One header, not two. Using `expires 1y` alongside an add_header emits two
        # conflicting Cache-Control lines and leaves the winner up to the client.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. BrowserRouter owns paths like /merchant/invoices/:id, which exist
    # only in the client bundle — without this, a hard refresh or a pasted deep link
    # would 404 because no such file is on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one file that must never be cached: it carries the references
    # to the hashed asset URLs, so a stale copy pins the browser to the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
